# Server-side twin of the local pre-commit gate (.githooks/pre-commit).
# The local hook is skippable with --no-verify; this is not. Both suites are
# offline by design — no OPENROUTER key, no live sites, $0.00 — so CI never
# spends money and never flakes on someone else's DOM (eval-protocol).
name: eval-gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI's own wall-clock ceiling. The local ruling is 60s and is unchanged;
      # this runner is slower, and one number cannot be tight on a laptop and
      # true here. Measured, not chosen: four runs of the same commit on
      # ubuntu-latest gave 59.77 / 60.84 / 64.61 / 64.67s — an 8% spread on
      # identical code — and 75s is the slowest of those plus one more
      # spread-width for runner variance. Raising it is an ADR-013 amendment,
      # and `fast-wall-clock-budget` grades the value declared here.
      EVAL_WALL_BUDGET_S: "75"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r src/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m evals.run --suite invariant
      - run: python -m evals.run --suite fast

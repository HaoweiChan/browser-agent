# Server-side twin of the local pre-commit gate (.githooks/pre-commit).
# The local hook is skippable with --no-verify; this is not. Both suites are
# offline by design — no OPENROUTER key, no live sites, $0.00 — so CI never
# spends money and never flakes on someone else's DOM (eval-protocol).
name: eval-gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI's own wall-clock ceiling. The local ruling is 60s; this runner is
      # slower, and one number cannot be tight on a laptop and true here.
      # Measured, not chosen: the rule is the slowest observed run in THIS
      # environment plus 15%. It was 80 when the suite was ~100 cases (from a
      # 68.96s run); at 131 cases CI measured 80.34s with every case passing,
      # so 80.34 x 1.15 = 92.4 -> 92 (ADR-020, which also records why this is a
      # ceiling derived against a smaller suite rather than a threshold moved
      # to hide a red run, and what would falsify that). Raising it is an
      # ADR-013 amendment, and `fast-wall-clock-budget` grades the value
      # declared here.
      EVAL_WALL_BUDGET_S: "92"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r src/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m evals.run --suite invariant
      - run: python -m evals.run --suite fast

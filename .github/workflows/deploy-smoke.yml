# E2E against the DEPLOYED instance — the layer eval-gate cannot see.
# Every check is free by construction: the guard rejects before a browser
# opens, and /smoke/stream drives a real Chromium with no LLM call. The M5
# incident this exists for: the URL served the M1 build for four milestones
# while every suite stayed green.
#
# Known ceiling (stated, not hidden): on push events this cannot prove it is
# testing the NEW build — Zeabur keeps serving the old one until the deploy
# flips, and the app exposes no /version. The fixed wait is a heuristic; a
# /version endpoint compared against GITHUB_SHA is the honest fix and goes
# through the eval loop as its own change.
name: deploy-smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]

env:
  BASE: https://whaleforce-browser-agent.zeabur.app

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: give Zeabur time to flip the deployment (push only)
        if: github.event_name == 'push'
        run: sleep 240
      - name: deployment answers
        run: |
          for i in $(seq 1 15); do
            curl -fsS -m 10 "$BASE/" >/dev/null && exit 0
            sleep 20
          done
          echo "deployment never answered"; exit 1
      - name: frontend serves the app shell
        run: curl -fsS -m 15 "$BASE/" | grep -q 'id="task"'
      - name: support matrix serves, with limitations declared
        run: |
          curl -fsS -m 15 "$BASE/support-matrix" \
            | jq -e '(.rows | length > 0) and (.limitations | length > 0)'
      - name: URL guard refuses loopback before a browser opens
        run: |
          code=$(curl -s -o guard.json -w '%{http_code}' -m 15 -X POST "$BASE/tasks" \
            -H 'content-type: application/json' \
            -d '{"task":"read the admin page","url":"http://127.1/admin"}')
          cat guard.json; echo
          test "$code" = "422" && grep -q "url blocked" guard.json
      # A busy service is not a broken one. M40 made /smoke/stream refuse while a
      # run holds the semaphore, so that a second Chromium is never launched
      # beside the agent's -- and this step then failed the moment anyone used
      # the demo, which for a public URL is whenever anyone is looking at it
      # (run 32677457166: refused with "a run is executing (e26da76d)").
      #
      # So: retry. A `done` passes. Anything OTHER than the concurrency refusal
      # fails immediately -- a broken browser must still be caught. Exhausting
      # the retries on refusals alone does NOT fail, because the deployment
      # answered every time and correctly serialised; but it does not silently
      # pass either, because the property genuinely went unchecked and the log
      # says so in those words.
      - name: real Chromium launches and navigates on the deployment
        run: |
          for i in $(seq 1 6); do
            curl -fsS -N -m 90 "$BASE/smoke/stream" > smoke.log || true
            cat smoke.log
            if grep -q '"event": "done"' smoke.log; then
              echo "chromium launched and navigated"; exit 0
            fi
            if ! grep -q 'one browser at a time' smoke.log; then
              echo "smoke stream failed for a reason other than concurrency"; exit 1
            fi
            echo "attempt $i: a run holds the browser; retrying in 30s"
            sleep 30
          done
          echo "::warning::UNCHECKED — a run held the browser for every attempt." \
               "The deployment answered each time and refused correctly, so this is" \
               "not a failure, but real-Chromium-on-the-deployment was NOT verified" \
               "by this job."


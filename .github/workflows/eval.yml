# Server-side twin of the local pre-commit gate (.githooks/pre-commit).
# The local hook is skippable with --no-verify; this is not. Both suites are
# offline by design — no OPENROUTER key, no live sites, $0.00 — so CI never
# spends money and never flakes on someone else's DOM (eval-protocol).
name: eval-gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI's own wall-clock ceilings, one variable per suite (ADR-017). One
      # number cannot be tight locally and true on a runner ~1.6x slower, and
      # `invariant` needs the same treatment `fast` already had: it was enforcing
      # a locally-measured 15s that CI had never run, and CI went red at 15.06s
      # and 15.22s with 46/46 passing (PR #29 R15).
      #
      # PROVISIONAL — this commit is a measurement run. Both numbers are
      # deliberately far above anything this suite can take, so the workflow
      # completes and reports what CI actually costs at the final case count.
      # The ADR-017 amendment carrying the derived numbers is the next commit.
      EVAL_WALL_BUDGET_S_FAST: "200"
      EVAL_WALL_BUDGET_S_INVARIANT: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r src/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m evals.run --suite invariant
      - run: python -m evals.run --suite fast

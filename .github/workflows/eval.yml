# Server-side twin of the local pre-commit gate (.githooks/pre-commit).
# The local hook is skippable with --no-verify; this is not. Both suites are
# offline by design — no OPENROUTER key, no live sites, $0.00 — so CI never
# spends money and never flakes on someone else's DOM (eval-protocol).
name: eval-gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI's own wall-clock ceilings, one variable per suite (ADR-019 §4). One
      # number cannot be tight locally and true on a runner ~1.6x slower, and
      # `invariant` needs the same treatment `fast` already had: it was
      # enforcing a locally-measured 15s that CI had never run, and CI went red
      # at 15.06s and 15.22s with 46/46 passing (PR #29 R15).
      #
      # Measured here, on this runner, not projected from local numbers: four
      # attempts of one run (32937020758 on 14a6a7b, 213 fast / 74 invariant
      # cases) gave
      #   invariant  18.59 / 18.65 / 18.88 / 18.72s
      #   fast       105.14 / 101.73 / 106.75 / 107.89s
      # ADR-013 Decision 3's rule is the slowest observed run +15%, rounded up
      # to a multiple of five: 18.88 x 1.15 = 21.71 -> 25, and
      # 107.89 x 1.15 = 124.07 -> 125. Every one of those attempts was
      # correctness-green (213/213, 74/74) and every one was over the 90s this
      # file used to declare, which is what moved these numbers: the breach was
      # in the budget, never in the results. `invariant` moves with it although
      # it was never over budget — its tree grew 48 -> 74 cases, and deriving
      # one suite from this table while leaving the other on the old one would
      # publish two trees in one table (PR #57 R7). ADR-019 §5 is the graded
      # source for all eight cells above; `ci-numbers-are-derived` compares them
      # cell-by-cell against it, and `fast-wall-clock-budget` grades both values
      # declared below.
      EVAL_WALL_BUDGET_S_FAST: "125"
      EVAL_WALL_BUDGET_S_INVARIANT: "25"
      # Which environment measured a history row (ADR-019 §7). The `invariant`
      # step below appends its row to this job's copy of the ledger before the
      # `fast` step grades ADR-019 §3's band against it. Untagged, that row is
      # read as this laptop's: it is clean (fresh checkout) and its UTC `ts`
      # sorts hours before a Taipei-stamped band row written earlier in real
      # time, so it satisfied "a clean row was already available" and reddened a
      # band it had nothing to do with — red on CI, green locally, same tree
      # (T-R44). `evals/run.py`'s `CI` fallback is what does the tagging, since
      # Actions sets `CI` unconditionally; this line only says it out loud.
      EVAL_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r src/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m evals.run --suite invariant
      - run: python -m evals.run --suite fast

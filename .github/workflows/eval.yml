# Server-side twin of the local pre-commit gate (.githooks/pre-commit).
# The local hook is skippable with --no-verify; this is not. Both suites are
# offline by design — no OPENROUTER key, no live sites, $0.00 — so CI never
# spends money and never flakes on someone else's DOM (eval-protocol).
name: eval-gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI's own wall-clock ceiling. The local ruling is 60s; this runner is
      # slower, and one number cannot be tight on a laptop and true here.
      # Measured, not chosen: four runs of the merged tree on ubuntu-latest gave
      # 64.29 / 67.51 / 68.94 / 68.96s — a 7% spread on identical code — and the
      # rule is the slowest observed run plus 15%, rounded up to a multiple of
      # five: 68.96 x 1.15 = 79.3 -> 80. Raising it is an ADR-013 amendment, and
      # `fast-wall-clock-budget` grades the value declared here.
      EVAL_WALL_BUDGET_S: "80"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r src/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m evals.run --suite invariant
      - run: python -m evals.run --suite fast
